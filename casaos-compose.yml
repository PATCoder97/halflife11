name: halflife11

services:
  halflife11-app:
    cpu_shares: 90
    container_name: halflife11-app
    depends_on:
      halflife11-db:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://halflife:change_me_strong_password@halflife11-db:5432/halflife?schema=public
      - AUTH_SECRET=change_me_auth_secret
      - NEXTAUTH_URL=https://halflife.example.com
      - GOOGLE_CLIENT_ID=change_me_google_client_id
      - GOOGLE_CLIENT_SECRET=change_me_google_client_secret
      - ADMIN_EMAILS=admin@example.com
      - WATER_UNIT_NAME=chai nước
    hostname: halflife11-app
    image: patcoder97/halflife11:latest
    labels:
      icon: https://raw.githubusercontent.com/PATCoder97/halflife11/main/app/icon.png
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes: []
    devices: []
    cap_add: []
    networks:
      - halflife11_network
    privileged: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      timeout: 5s
      interval: 15s
      retries: 10
      start_period: 30s

  halflife11-db:
    cpu_shares: 90
    command: []
    container_name: halflife11-db
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - POSTGRES_DB=halflife
      - POSTGRES_PASSWORD=change_me_strong_password
      - POSTGRES_USER=halflife
    hostname: halflife11-db
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U halflife -d halflife
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 10s
    image: postgres:16-alpine
    labels:
      icon: https://raw.githubusercontent.com/PATCoder97/halflife11/main/app/icon.png
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/halflife11/pgdata
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    ports: []
    devices: []
    cap_add: []
    networks:
      - halflife11_network
    privileged: false

networks:
  halflife11_network:
    name: halflife11_network
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  author: PATCoder97
  category: CasaOS-App
  description:
    en_us: HalfLife Water Ledger - Next.js app with PostgreSQL for match scores, leaderboard, and water settlement.
  developer: ""
  hostname: ""
  icon: https://raw.githubusercontent.com/PATCoder97/halflife11/main/app/icon.png
  index: /
  is_uncontrolled: false
  main: halflife11-app
  port_map: "3000"
  scheme: http
  store_app_id: halflife11
  tagline:
    en_us: HalfLife match ledger and water settlement
  thumbnail: ""
  title:
    custom: halflife11
    en_us: HalfLife Water Ledger
